# Which parts of the virtio-win ISO end up in the package.
# Sourced by scripts/slim.sh.

# driver directories (ISO layout: <driver>/<os>/<arch>/)
DRIVERS="viostor vioscsi NetKVM Balloon vioserial"

# Windows versions
OSES="w10 w11 2k16 2k19 2k22 2k25"

# guest architectures
ARCHES="amd64 ARM64"

# additional files copied as-is (relative to the ISO root, missing ones are skipped)
EXTRA_FILES="guest-agent/qemu-ga-x86_64.msi virtio-win_license.txt"

# installers only put on the ISO (pxvirt-virtio-win-iso), not into the driver package
ISO_EXTRA_FILES="virtio-win-gt-x64.msi virtio-win-guest-tools.exe"
