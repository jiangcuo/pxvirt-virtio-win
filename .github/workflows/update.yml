name: Update virtio-win

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      channel:
        description: virtio-win channel to follow
        type: choice
        options: [stable, latest]
        default: stable
      version:
        description: Explicit virtio-win version (e.g. 0.1.271), empty for the channel's current one
        type: string
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: update
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
          VERSION_INPUT: ${{ inputs.version }}
        run: scripts/update-version.sh --channel "$CHANNEL" $VERSION_INPUT

      # the build below reuses the ISO that was downloaded to compute the checksum
      - if: steps.update.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/virtio-win-*.iso
          key: virtio-win-iso-${{ hashFiles('VERSION') }}

      - id: commit
        if: steps.update.outputs.changed == 'true'
        env:
          MESSAGE: ${{ steps.update.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "$MESSAGE"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
      release: true
